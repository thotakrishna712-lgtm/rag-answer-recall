[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-answer-recall"
version = "0.1.0"
description = "Change-aware RAG: CDC-driven chunk versioning, answer recall, and golden-set drift gates"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Krishna Thota" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.9.0",
]

[project.optional-dependencies]
kafka = ["confluent-kafka>=2.5.0"]
mlflow = ["mlflow>=2.17.0"]
spark = ["pyspark>=3.5.0,<4"]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.scripts]
ragrecall-demo = "ragrecall.demo:main"
ragrecall-gate = "ragrecall.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.coverage.run]
source = ["ragrecall"]
omit = ["*/ragrecall/demo.py", "*/ragrecall/adapters/openai_generator.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
