name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint and format
        run: |
          ruff check src tests scripts databricks
          ruff format --check src tests scripts databricks
      - name: Type check (strict)
        run: mypy src
      - name: Tests
        run: pytest --cov=ragrecall --cov-report=term-missing --cov-fail-under=80

  spark:
    name: spark parity (local Spark, Java 17)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev,spark]"
      - name: Spark planner vs SQLite reference
        run: pytest tests/spark -v

  docker:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t rag-answer-recall:ci .
      - name: Smoke test container
        run: |
          docker run -d --name api -p 8000:8000 rag-answer-recall:ci
          for i in $(seq 1 20); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf -X POST localhost:8000/v1/ask -H "X-User-Groups: retail_analyst" \
            -H "Content-Type: application/json" \
            -d '{"question":"How long must wire transfer audit logs be retained?"}'
